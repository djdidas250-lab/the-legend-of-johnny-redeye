name: Build Android APK
# Rebuild animation previews after clearing enclosed white matte pockets in octopus cells.
# Rebuild after correcting octopus extraction to the authored 3x4 sprite grid.

on:
  push:
    branches: [main, "build/*", "feature/cinematic-new-game-intro"]
  workflow_dispatch:

concurrency:
  group: android-apk-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    name: Export Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out game
        uses: actions/checkout@v4

      - name: Extract supplied cinematic intro assets
        run: |
          test -s images/introscreen.zip
          mkdir -p images/intro_assets
          unzip -o images/introscreen.zip -d images/intro_assets
          test -s images/intro_assets/Intro1.jpg
          test -s images/intro_assets/Intro2.jpg
          test -s images/intro_assets/Intro3.jpg
          test -s images/intro_assets/Intro4.jpg
          test -s images/intro_assets/Intro5.jpeg
          test -s "images/intro_assets/intro 6.jpeg"
          test -s "images/intro_assets/01 Intro.mp3"

      - name: Match cinematic intro loudness to Leeside stage music
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          intro = Path("images/intro_assets/01 Intro.mp3")
          stage = Path("images/7. Soldier.mp3")
          temporary = intro.with_name("01 Intro matched.mp3")

          def measure(path):
              result = subprocess.run(
                  ["ffmpeg", "-v", "info", "-i", str(path), "-af",
                   "loudnorm=print_format=json", "-f", "null", "-"],
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True
              )
              if result.returncode != 0:
                  raise RuntimeError(f"FFmpeg could not measure {path}: {result.stderr.strip()}")
              matches = re.findall(r'\{\s*"input_i".*?\}', result.stderr, re.S)
              if not matches:
                  raise RuntimeError(f"Could not read loudness measurement for {path}")
              stats = json.loads(matches[-1])
              integrated = float(stats["input_i"])
              if not (-70.0 < integrated < 0.0):
                  raise RuntimeError(f"Invalid integrated loudness for {path}: {integrated}")
              return integrated

          target_lufs = measure(stage)
          print(f"LEASIDE_STAGE_INTEGRATED_LUFS={target_lufs:.2f}")
          subprocess.run(
              ["ffmpeg", "-y", "-hide_banner", "-i", str(intro), "-af",
               f"loudnorm=I={target_lufs:.2f}:TP=-1.5:LRA=11",
               "-c:a", "libmp3lame", "-b:a", "256k", str(temporary)],
              stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, check=True
          )
          temporary.replace(intro)
          matched_lufs = measure(intro)
          print(f"CINEMATIC_INTRO_MATCHED_LUFS={matched_lufs:.2f}")
          difference = abs(matched_lufs - target_lufs)
          print(f"INTRO_VS_LEASIDE_LOUDNESS_DIFFERENCE_DB={difference:.2f}")
          if difference > 1.0:
              raise RuntimeError(f"Intro loudness did not match Leeside music: {difference:.2f} LU")
          PY

      - name: Upload original intro frames for visual coordinate inspection
        uses: actions/upload-artifact@v4
        with:
          name: intro-source-frames
          path: |
            images/intro_assets/Intro1.jpg
            images/intro_assets/Intro2.jpg
            images/intro_assets/Intro3.jpg
            images/intro_assets/Intro4.jpg
            images/intro_assets/Intro5.jpeg
          retention-days: 3
          if-no-files-found: error

      - name: Extract supplied character sprite sheets
        run: |
          test -s Dorval_Extracted_Sprite_Sheets.zip
          mkdir -p images/sprites
          unzip -o Dorval_Extracted_Sprite_Sheets.zip -d images/sprites
          python3 -m pip install --user Pillow numpy scipy
          python3 tools/prepare_john_animations.py
          python3 tools/prepare_davy_jones.py
          python3 tools/prepare_mattijuana.py
          python3 tools/create_mattijuana_previews.py
          test -s "images/01 - Falling Apart (Prologue).ogg"
          test -s images/heygen-speech.wav
          test -s "images/10_Angel With The Scabbed Wings.mp3"
          test -s images/sprites/mattijuana_front_walk.png
          test -s images/sprites/mattijuana_human_walk.png
          test -s images/sprites/mattijuana_human_attack.png
          test -s images/sprites/mattijuana_human_fall.png
          test -s images/sprites/mattijuana_human_recover.png
          test -s images/sprites/mattijuana_joint_phase.png
          test -s images/sprites/mattijuana_monster_phase.png
          test -s images/sprites/mattijuana_joint_idle.png
          test -s images/sprites/mattijuana_joint_walk.png
          test -s images/sprites/mattijuana_joint_attack.png
          test -s images/sprites/mattijuana_monster_idle.png
          test -s images/sprites/mattijuana_monster_walk.png
          test -s images/sprites/mattijuana_monster_attack.png
          test -s images/sprites/mattijuana_monster_fire_breath.png
          test -s images/sprites/mattijuana_joint_to_monster.png
          test -s images/sprites/davy_human_entrance.png
          test -s images/sprites/davy_transformation.png
          test -s images/sprites/davy_octopus_walk_down.png
          test -s images/sprites/davy_octopus_walk_up.png
          test -s images/sprites/davy_octopus_transition.png
          test -s images/sprites/davy_octopus_attack.png
          test -s images/sprites/enemy_updated.png
          for asset in john_walk john_walk_away john_walk_toward john_punch john_hurt_recovery john_slingshot; do
            test -s "images/sprites/${asset}.png"
          done

      - name: Publish Matt-ijuana frame review images to workflow log
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          for name in ("mattijuana_entrance_walk.gif", "mattijuana_human_walk.gif", "mattijuana_human_attack.gif", "mattijuana_human_fall.gif", "mattijuana_human_recover.gif", "mattijuana_human_to_joint.gif", "mattijuana_joint_idle.gif", "mattijuana_joint_attack.gif", "mattijuana_joint_recovery.gif", "mattijuana_joint_to_monster.gif", "mattijuana_monster_idle.gif", "mattijuana_monster_walk.gif", "mattijuana_monster_attack.gif", "mattijuana_monster_fire_breath.gif", "mattijuana_human_attack_contact.png", "mattijuana_human_fall_contact.png", "mattijuana_human_recover_contact.png", "mattijuana_joint_attack_contact.png", "mattijuana_joint_recovery_contact.png", "mattijuana_joint_to_monster_contact.png", "mattijuana_monster_attack_contact.png", "mattijuana_monster_fire_breath_contact.png", "mattijuana_monster_source_grid.png", "mattijuana_joint_source_grid.png", "mattijuana_all_sequences_overview.png"):
              data = (Path("build/mattijuana_previews") / name).read_bytes()
              print(f"MATTIJUANA_{name.upper().replace('.', '_')}_BASE64=" + base64.b64encode(data).decode("ascii"))
          PY

      - name: Generate and publish Davy Jones animation review previews
        run: |
          test -s build/davy_previews/davy_human_walk.gif
          test -s build/davy_previews/davy_human_attack.gif
          test -s build/davy_previews/davy_human_fall.gif
          test -s build/davy_previews/davy_entrance.gif
          test -s build/davy_previews/davy_transformation.gif
          test -s build/davy_previews/davy_octopus_walk_down.gif
          test -s build/davy_previews/davy_octopus_walk_up.gif
          test -s build/davy_previews/davy_octopus_transition.gif
          test -s build/davy_previews/davy_octopus_walk.gif
          test -s build/davy_previews/davy_octopus_attack.gif
          python3 - <<'PY'
          import base64
          from pathlib import Path
          source = Path("images/Gemini_Generated_Image_tly5t5tly5t5tly5.jpeg").read_bytes()
          print("SOURCE_OCTOPUS_SHEET_BASE64=" + base64.b64encode(source).decode("ascii"))
          for name in ("davy_human_walk_contact.png", "davy_human_attack_contact.png", "davy_human_fall_contact.png", "davy_entrance_contact.png", "davy_transformation_contact.png", "davy_octopus_walk_contact.png", "davy_octopus_walk_down_contact.png", "davy_octopus_walk_up_contact.png", "davy_octopus_transition_contact.png", "davy_octopus_idle_contact.png", "davy_octopus_attack_contact.png", "davy_transformation_handoff_contact.png", "davy_human_walk.gif", "davy_human_attack.gif", "davy_human_fall.gif", "davy_entrance.gif", "davy_transformation.gif", "davy_octopus_walk.gif", "davy_octopus_walk_down.gif", "davy_octopus_walk_up.gif", "davy_octopus_transition.gif", "davy_octopus_attack.gif", "davy_transformation_handoff.gif"):
              data = (Path("build/davy_previews") / name).read_bytes()
              print(f"PREVIEW_{name}_BASE64=" + base64.b64encode(data).decode("ascii"))
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Godot 4.4.1 and export templates
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.4.1-stable
          export-templates: true

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: dorval-android-debug-keystore-v1

      - name: Configure Android export settings
        run: |
          mkdir -p ~/.config/godot ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -noprompt -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          test -x "${ANDROID_HOME}/platform-tools/adb"
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          test -d "${ANDROID_HOME}/platforms/android-34"
          test -d "${ANDROID_HOME}/build-tools/34.0.0"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=${HOME}/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Verify supplied continuous Newleaf street panorama
        run: |
          test -s images/image_54ce9940.jpg
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from PIL import Image
          image = Image.open('images/image_54ce9940.jpg')
          assert image.width >= 1800 and image.height >= 450, image.size
          print('Verified supplied continuous Newleaf route:', image.size)
          PY

      - name: Verify complete Leaside panorama
        run: |
          test -s images/image_928e623e.jpg
          python3 - <<'PY'
          from PIL import Image
          image = Image.open('images/image_928e623e.jpg')
          assert image.width >= 1600 and image.height >= 400, image.size
          assert image.width / image.height >= 3.0, image.size
          print('Verified complete single-image Leaside panorama:', image.size)
          PY

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Validate project scripts
        run: godot --headless --path . --quit

      - name: Smoke test game startup
        run: godot --headless --path . --quit-after 5

      - name: Test core gameplay loop
        run: timeout 90s godot --headless --path . --scene res://tests/gameplay_smoke_test.tscn

      - name: Render and capture live atmosphere animation
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri
          mkdir -p build/atmosphere-captures
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot --path . --script res://tests/atmosphere_visual_capture.gd --audio-driver Dummy 2>&1 | tee atmosphere-capture.log
          grep -q "ATMOSPHERE_VISUAL_CAPTURE_COMPLETE" atmosphere-capture.log
          grep -q "CUTSCENE_CAPTURE_COUNT=4" atmosphere-capture.log
          grep -q "STREET_ATMOSPHERE_HANDOFF_COUNT=4" atmosphere-capture.log
          test "$(find build/atmosphere-captures -maxdepth 1 -type f -name 'cutscene_*.png' | wc -l)" -eq 4
          for frame in build/atmosphere-captures/cutscene_mcrae.png build/atmosphere-captures/cutscene_newleaf.png build/atmosphere-captures/cutscene_woodlawn_road.png build/atmosphere-captures/cutscene_woodlawn_park.png; do
            test -s "$frame"
          done

      - name: Publish compact rendered frames to workflow log
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64
          capture_dir = Path("build/atmosphere-captures")
          for path in sorted(capture_dir.glob("*.png")):
              image = Image.open(path).convert("RGB")
              image.thumbnail((640, 360), Image.Resampling.LANCZOS)
              import io
              buffer = io.BytesIO()
              image.save(buffer, format="JPEG", quality=68, optimize=True)
              encoded = base64.b64encode(buffer.getvalue()).decode("ascii")
              print(f"ATMOSPHERE_JPEG_BEGIN={path.stem}")
              for offset in range(0, len(encoded), 4000):
                  print("ATMOSPHERE_JPEG_DATA=" + encoded[offset:offset + 4000])
              print(f"ATMOSPHERE_JPEG_END={path.stem} bytes={len(buffer.getvalue())} size={image.size}")
          PY

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/TheLegendOfJohnnyRedeye.apk
          test -s build/TheLegendOfJohnnyRedeye.apk

      - name: Verify APK package and Android launcher name
        run: |
          file build/TheLegendOfJohnnyRedeye.apk
          unzip -t build/TheLegendOfJohnnyRedeye.apk
          "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --verbose build/TheLegendOfJohnnyRedeye.apk
          AAPT="${ANDROID_HOME}/build-tools/34.0.0/aapt"
          "$AAPT" dump badging build/TheLegendOfJohnnyRedeye.apk | tee build/apk-badging.txt
          grep -F "package: name='com.djdidas.legendofdorval'" build/apk-badging.txt
          grep -F "application-label:'The Legend of Johnny Redeye'" build/apk-badging.txt
          grep -F "label='The Legend of Johnny Redeye'" build/apk-badging.txt | grep -F "launchable-activity:"
          "$AAPT" dump xmltree build/TheLegendOfJohnnyRedeye.apk AndroidManifest.xml | tee build/apk-manifest.txt

      - name: Publish installable APK as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: The Legend of Johnny Redeye - Latest Android test build #${{ github.run_number }}
          overwrite_files: true
          prerelease: true
          generate_release_notes: false
          body: |
            Automated Android test build.
            Commit: ${{ github.sha }}
            APK was exported, package-checked, and signature-verified by the workflow.
          files: |
            build/TheLegendOfJohnnyRedeye.apk

# QA build: verify front-facing octopus bridge between transformation and walk.

