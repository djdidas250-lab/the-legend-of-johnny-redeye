name: Inspect John and Gil Cinematic Assets
on:
  push:
    paths:
      - '.github/workflows/inspect-john-gil-assets.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and inspect archive
        run: |
          python -m pip install pillow
          mkdir -p /tmp/john-gil
          python - <<'PY'
          import zipfile, pathlib, json, subprocess
          zpath=pathlib.Path("images/John and Gil.zip")
          out=pathlib.Path("/tmp/john-gil/extracted")
          out.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(zpath) as z:
              z.extractall(out)
              entries=[{"name":i.filename,"size":i.file_size,"compressed":i.compress_size} for i in z.infolist() if not i.is_dir()]
          (pathlib.Path("/tmp/john-gil/archive_manifest.json")).write_text(json.dumps(entries,indent=2))
          print(json.dumps(entries,indent=2))
          PY
          cat > /tmp/john-gil/make_contact.py <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          from pathlib import Path
          import math, json
          root=Path("/tmp/john-gil/extracted")
          files=[]
          for p in root.rglob("*"):
              if p.is_file():
                  try:
                      im=Image.open(p)
                      im.load()
                      files.append((p,im.convert("RGBA")))
                  except Exception:
                      pass
          W,H=320,230
          cols=3
          rows=max(1,math.ceil(len(files)/cols))
          sheet=Image.new("RGB",(cols*W,rows*H),(35,35,35))
          d=ImageDraw.Draw(sheet)
          for i,(p,im) in enumerate(files):
              x=(i%cols)*W; y=(i//cols)*H
              thumb=im.copy()
              thumb.thumbnail((W-16,H-50))
              bg=Image.new("RGBA",thumb.size,(65,65,65,255)); bg.alpha_composite(thumb)
              sheet.paste(bg.convert("RGB"),(x+(W-thumb.width)//2,y+6))
              d.text((x+8,y+H-38),p.relative_to(root).as_posix()[:46],fill="white")
              d.text((x+8,y+H-20),f"{im.width}x{im.height}",fill="#bbbbbb")
          sheet.save("/tmp/john-gil/contact-sheet.jpg",quality=92)
          print("Image count:",len(files))
          PY
          python /tmp/john-gil/make_contact.py
          echo '--- AUDIO METADATA ---'
          find /tmp/john-gil/extracted -type f | while read f; do
            case "$f" in
              *.wav|*.mp3|*.ogg|*.m4a|*.flac|*.aac) ffprobe -v error -show_entries format=filename,duration,size:stream=codec_name,sample_rate,channels -of json "$f" || true ;;
            esac
          done | tee /tmp/john-gil/audio-metadata.txt
          cd /tmp
          zip -qr john-gil-inspection.zip john-gil
      - uses: actions/upload-artifact@v4
        with:
          name: john-gil-inspection
          path: /tmp/john-gil-inspection.zip
          retention-days: 7
