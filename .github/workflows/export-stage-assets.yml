name: Export Stage Artwork for Local Assembly
on:
  push:
    paths:
      - '.github/workflows/export-stage-assets.yml'
  workflow_dispatch:
jobs:
  export-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package stage artwork and panorama references
        run: |
          mkdir -p /tmp/dorval-assets
          cp -a images /tmp/dorval-assets/
          cp -a docs/NEWLEAF_PROPERTY_MAP.md /tmp/dorval-assets/
          cp -a tools/create_newleaf_panorama.py /tmp/dorval-assets/
          find /tmp/dorval-assets -type f -printf '%P\n' | sort
          cd /tmp
          zip -qr dorval-stage-assets.zip dorval-assets
      - name: Emit a compact visual preview for inspection
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          import base64, io
          source = Image.open("images/file_000000005268822f8114c8d6d185d9e5.png").convert("RGB")
          source.thumbnail((720, 720))
          output = io.BytesIO()
          source.save(output, format="JPEG", quality=72, optimize=True)
          print("TITLE_SCREEN_PREVIEW_BEGIN")
          print(base64.b64encode(output.getvalue()).decode("ascii"))
          print("TITLE_SCREEN_PREVIEW_END")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dorval-stage-assets
          path: /tmp/dorval-stage-assets.zip
          if-no-files-found: error
          retention-days: 3
