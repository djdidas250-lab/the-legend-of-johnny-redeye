name: Temporary intro asset inspection
on:
  push:
    branches:
      - temp/inspect-introscreen-assets
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install media inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pil
      - name: Extract archive and inspect media
        run: |
          mkdir -p /tmp/intro-assets /tmp/intro-report
          python3 - <<'PY'
          import zipfile, pathlib
          zpath = pathlib.Path("images/introscreen.zip")
          if not zpath.exists():
              raise SystemExit("images/introscreen.zip not found")
          with zipfile.ZipFile(zpath) as z:
              z.extractall("/tmp/intro-assets")
              for i in z.infolist():
                  print(f"{i.filename}\t{i.file_size} bytes")
          PY
          cp -a /tmp/intro-assets/. /tmp/intro-report/
          find /tmp/intro-assets -type f -print0 | while IFS= read -r -d '' f; do
            file "$f" >> /tmp/intro-report/file-types.txt
            case "$f" in
              *.mp3|*.wav|*.ogg|*.m4a|*.aac|*.flac)
                ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$f" >> /tmp/intro-report/audio-durations.txt
                echo "$f" >> /tmp/intro-report/audio-files.txt
                ;;
            esac
          done
          python3 - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          from pathlib import Path
          files = sorted([p for p in Path("/tmp/intro-assets").rglob("*") if p.suffix.lower() in {".jpg",".jpeg",".png",".webp"}])
          thumbs=[]
          for p in files:
              im=Image.open(p).convert("RGB")
              original=im.size
              im.thumbnail((640,360))
              tile=Image.new("RGB",(660,410),"white")
              tile.paste(im,((660-im.width)//2,15))
              ImageDraw.Draw(tile).text((12,380),f"{p.name} | {original[0]}x{original[1]}",fill="black")
              thumbs.append(tile)
          if thumbs:
              sheet=Image.new("RGB",(1320,410*((len(thumbs)+1)//2)),(35,35,35))
              for i,im in enumerate(thumbs): sheet.paste(im,((i%2)*660,(i//2)*410))
              sheet.save("/tmp/intro-report/contact-sheet.jpg",quality=92)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: introscreen-extracted
          path: /tmp/intro-report/
          if-no-files-found: error
