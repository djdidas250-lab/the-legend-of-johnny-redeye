name: Temporary Matt-ijuana Sprite Inspection

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-mattijuana-inspection.yml"

permissions:
  contents: write

jobs:
  inspect-sprite-sheets:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Generate UTF-8 SVG previews with embedded originals
        run: |
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64
          names = [
              "Gemini_Generated_Image_6bcmqi6bcmqi6bcm.jpeg",
              "Gemini_Generated_Image_7c899f7c899f7c89.jpeg",
              "Gemini_Generated_Image_g9722kg9722kg972.jpeg",
              "Gemini_Generated_Image_u02s9gu02s9gu02s.jpeg",
              "Gemini_Generated_Image_ure48yure48yure4.jpeg",
          ]
          outdir = Path("inspection-previews")
          outdir.mkdir(exist_ok=True)
          for index, name in enumerate(names, 1):
              path = Path("images") / name
              im = Image.open(path).convert("RGB")
              data = base64.b64encode(path.read_bytes()).decode("ascii")
              svg = f'''<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="{im.width}" height="{im.height}" viewBox="0 0 {im.width} {im.height}"><image x="0" y="0" width="{im.width}" height="{im.height}" xlink:href="data:image/jpeg;base64,{data}"/></svg>'''
              (outdir / f"sheet-{index}.svg").write_text(svg)
              print(f"Prepared sheet {index}: {name}, {im.width}x{im.height}")
          PY
      - name: Commit temporary previews for visual retrieval
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inspection-previews/*.svg
          git commit -m "Temporarily publish Matt-ijuana sprite previews"
          git push
