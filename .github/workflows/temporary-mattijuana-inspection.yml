name: Temporary Matt-ijuana Sprite Inspection

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-mattijuana-inspection.yml"

permissions:
  contents: read

jobs:
  inspect-sprite-sheets:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Emit each original sprite sheet as a visual preview
        run: |
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, io
          names = [
              "Gemini_Generated_Image_6bcmqi6bcmqi6bcm.jpeg",
              "Gemini_Generated_Image_7c899f7c899f7c89.jpeg",
              "Gemini_Generated_Image_g9722kg9722kg972.jpeg",
          ]
          for index, name in enumerate(names, 1):
              im = Image.open(Path("images") / name).convert("RGB")
              print(f"SHEET_{index}_BEGIN {name} {im.width}x{im.height}")
              out = io.BytesIO()
              im.save(out, format="JPEG", quality=95, subsampling=0)
              print("SHEET_BASE64 " + base64.b64encode(out.getvalue()).decode("ascii"))
              print(f"SHEET_{index}_END")
          PY